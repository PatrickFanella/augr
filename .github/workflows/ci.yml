name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -short -race -count=1 -coverprofile=coverage-unit.out ./...

      - name: Upload unit coverage
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.out

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - unit-tests
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: tradingagent
          POSTGRES_PASSWORD: tradingagent
          POSTGRES_DB: tradingagent_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tradingagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download unit coverage
        if: github.server_url == 'https://github.com'
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit

      - name: Regenerate unit coverage for Gitea
        if: github.server_url != 'https://github.com'
        run: go test -short -race -count=1 -coverprofile=coverage-unit.out ./...

      - name: Configure integration database URL
        run: |
          database_container=$(docker ps --filter publish=55432 --filter ancestor=timescale/timescaledb:2.17.2-pg17 --format '{{.ID}}' | head -1)
          test -n "$database_container"
          database_host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$database_container")
          test -n "$database_host"
          echo "DATABASE_CONTAINER=$database_container" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://tradingagent:tradingagent@${database_host}:5432/tradingagent_test?sslmode=disable" >> "$GITHUB_ENV"

      - name: Run migrations
        run: |
          timeout 90 bash -c 'until docker exec "$DATABASE_CONTAINER" pg_isready -U tradingagent -d tradingagent_test >/dev/null 2>&1; do sleep 2; done'
          find migrations -maxdepth 1 -type f -name '*.up.sql' -print | sort | while read -r migration; do
            docker exec -i "$DATABASE_CONTAINER" psql -U tradingagent -d tradingagent_test --single-transaction --set ON_ERROR_STOP=1 < "$migration"
          done

      - name: Run integration tests
        run: go test -race -count=1 -run Integration -coverprofile=coverage-integration.out ./...

      - name: Merge coverage profiles
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage-unit.out coverage-integration.out > coverage.out

      - name: Report coverage
        run: |
          UNIT_COVERAGE=$(go tool cover -func=coverage-unit.out | awk '/^total:/ {print $3}')
          INTEGRATION_COVERAGE=$(go tool cover -func=coverage-integration.out | awk '/^total:/ {print $3}')
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "Combined coverage: ${TOTAL_COVERAGE}"
          {
            echo "## Go test coverage"
            echo
            echo "- Unit: ${UNIT_COVERAGE}"
            echo "- Integration: ${INTEGRATION_COVERAGE}"
            echo "- Combined: ${TOTAL_COVERAGE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.smoke.yml
    needs:
      - changes
      - integration-tests
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate smoke JWT secret
        run: echo "SMOKE_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Configure smoke environment
        run: |
          cat > .env <<EOF
          APP_ENV=smoke
          APP_HOST=0.0.0.0
          APP_PORT=8080
          JWT_SECRET=${SMOKE_JWT_SECRET}
          DATABASE_URL=postgres://postgres:postgres@postgres:5432/tradingagent?sslmode=disable
          DATABASE_POOL_SIZE=10
          DATABASE_SSL_MODE=disable
          REDIS_URL=redis://redis:6379/0
          LLM_DEFAULT_PROVIDER=ollama
          LLM_DEEP_THINK_MODEL=smoke-deep
          LLM_QUICK_THINK_MODEL=smoke-quick
          LLM_TIMEOUT=30s
          OLLAMA_BASE_URL=http://ollama.invalid/v1
          OLLAMA_API_KEY=smoke-key
          OLLAMA_MODEL=smoke-model
          ALPHA_VANTAGE_API_KEY=smoke-key
          ALPHA_VANTAGE_RATE_LIMIT_PER_MINUTE=5
          FINNHUB_RATE_LIMIT_PER_MINUTE=60
          RISK_MAX_POSITION_SIZE_PCT=0.10
          RISK_MAX_DAILY_LOSS_PCT=0.02
          RISK_MAX_DRAWDOWN_PCT=0.10
          RISK_MAX_OPEN_POSITIONS=10
          RISK_CIRCUIT_BREAKER_THRESHOLD=0.05
          RISK_CIRCUIT_BREAKER_COOLDOWN=15m
          ENABLE_SCHEDULER=false
          ENABLE_REDIS_CACHE=false
          ENABLE_AGENT_MEMORY=false
          ENABLE_LIVE_TRADING=false
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=tradingagent
          EOF

      - name: Start docker compose
        run: docker compose up --build -d postgres redis app

      - name: Run migrations
        run: |
          timeout 90 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -d tradingagent >/dev/null 2>&1; do sleep 2; done'
          find migrations -maxdepth 1 -type f -name '*.up.sql' -print | sort | while read -r migration; do
            docker compose exec -T postgres psql -U postgres -d tradingagent --single-transaction --set ON_ERROR_STOP=1 < "$migration"
          done
          schema_version=$(find migrations -maxdepth 1 -type f -name '*.up.sql' -printf '%f\n' | sort | tail -1 | sed -E 's/^0*([0-9]+)_.*/\1/')
          case "$schema_version" in
            ''|*[!0-9]*) echo "invalid latest schema version: ${schema_version}" >&2; exit 1 ;;
          esac
          docker compose exec -T postgres psql -U postgres -d tradingagent --set ON_ERROR_STOP=1 --command \
            "CREATE TABLE schema_migrations (version bigint NOT NULL PRIMARY KEY, dirty boolean NOT NULL); INSERT INTO schema_migrations (version, dirty) VALUES (${schema_version}, false);"

      - name: Configure smoke targets
        run: |
          app_container=$(docker compose ps -q app)
          database_container=$(docker compose ps -q postgres)
          test -n "$app_container"
          test -n "$database_container"
          app_host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$app_container")
          database_host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$database_container")
          test -n "$app_host"
          test -n "$database_host"
          echo "SMOKE_BASE_URL=http://${app_host}:8080" >> "$GITHUB_ENV"
          echo "SMOKE_DATABASE_URL=postgres://postgres:postgres@${database_host}:5432/tradingagent?sslmode=disable" >> "$GITHUB_ENV"

      - name: Wait for API
        run: |
          timeout 90 bash -c 'until curl -fsS "${SMOKE_BASE_URL}/healthz" >/dev/null; do sleep 2; done'

      - name: Run smoke test
        env:
          RUN_SMOKE_TEST: "1"
          SMOKE_JWT_SECRET: ${{ env.SMOKE_JWT_SECRET }}
        run: go test -count=1 -run Smoke ./cmd/tradingagent

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down docker compose
        if: always()
        run: docker compose down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - unit-tests
      - integration-tests
      - smoke-tests
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o bin/tradingagent ./cmd/tradingagent

      - name: Verify binary runs
        run: ./bin/tradingagent --help || true

      - name: Build Docker image
        run: docker build -t tradingagent:ci .
